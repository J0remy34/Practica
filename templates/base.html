{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mi Tienda{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo-container">
            <img src="{% static 'images/logo.png' %}"
                 alt="Logo de la tienda"
                 class="logo">
            <span>Mi Tienda</span>
        </div>

        <ul class="menu">
            <li><a href="{% url 'inicio' %}">Inicio</a></li>
            <li><a href="{% url 'app1_inicio' %}">Productos</a></li>
            <li><a href="{% url 'app2_inicio' %}">Categorías</a></li>
            <li><a href="{% url 'app3_inicio' %}">Proveedores</a></li>
        </ul>

    </nav>
</header>

<main class="contenido">

    {% block content %}
    {% endblock %}

</main>

<footer>
    <p>Mi Tienda © 2026 | Proyecto Django</p>
</footer>

</body>
</html>
